name: Validate Python3 Migration

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run validation script
        run: |
          chmod +x ./scripts/validate_python3.sh
          ./scripts/validate_python3.sh
